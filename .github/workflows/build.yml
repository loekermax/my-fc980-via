name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y -H ./qmk_firmware

    - name: Force Overwrite Pure VIA Project and Compile
      run: |
        cd qmk_firmware
        
        # 1. 現場將 wilba 官方 VIA 專案的 info.json 覆蓋為我們的 STM32F401 6x16 盲測規格 (引腳回歸標準代號)
        cat << 'EOF' > keyboards/wilba_tech/wt60_a/info.json
        {
          "keyboard_name": "FC980 EC VIA REMAKE",
          "url": "https://github.com",
          "maintainer": "qmk",
          "width": 16,
          "height": 6,
          "matrix_pins": {
            "cols": ["B0", "B1", "B2", "B3", "B4", "B5", "B6", "B7", "B8", "B9", "B10", "B12", "B13", "B14", "B15", "A8"],
            "rows": ["A0", "A1", "A2", "A3", "A4", "A5"]
          },
          "diode_direction": "COL2ROW",
          "processor": "STM32F401",
          "bootloader": "stm32-dfu",
          "features": {
            "via": true,
            "lto": true
          }
        }
        EOF
        
        # 2. 現場寫入對齊 6x16 基礎矩陣的 keymap.c 檔
        cat << 'EOF' > keyboards/wilba_tech/wt60_a/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            [0] = {
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A }
            }
        };
        EOF
        
        # 3. 呼叫官方正式名義，執行純淨無燈光干擾的 QMK 編譯
        qmk compile -kb wilba_tech/wt60_a -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        path: qmk_firmware/.build/*.bin
