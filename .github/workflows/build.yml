name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y -H ./qmk_firmware

    - name: Force Overwrite Existing Mature Project and Compile
      run: |
        cd qmk_firmware
        
        # 1. 現場將 Keychron V5 官方專案的引腳與晶片規格，強行覆蓋為我們的 STM32F401 6x16 盲測規格
        cat << 'EOF' > keyboards/keychron/v5/info.json
        {
          "keyboard_name": "FC980 EC VIA REMAKE",
          "url": "https://github.com",
          "maintainer": "qmk",
          "width": 16,
          "height": 6,
          "matrix_pins": {
            "cols": ["PIN_B0", "PIN_B1", "PIN_B2", "PIN_B3", "PIN_B4", "PIN_B5", "PIN_B6", "PIN_B7", "PIN_B8", "PIN_B9", "PIN_B10", "PIN_B12", "PIN_B13", "PIN_B14", "PIN_B15", "PIN_A8"],
            "rows": ["PIN_A0", "PIN_A1", "PIN_A2", "PIN_A3", "PIN_A4", "PIN_A5"]
          },
          "diode_direction": "COL2ROW",
          "processor": "STM32F401",
          "bootloader": "stm32-dfu"
        }
        EOF
        
        # 2. 強制開啟 VIA 改鍵動態空間與 LTO 優化
        cat << 'EOF' > keyboards/keychron/v5/rules.mk
        VIA_ENABLE = yes
        LTO_ENABLE = yes
        EOF
        
        # 3. 現場寫入 96 顆按鍵完全填滿的 keymap.c 檔
        cat << 'EOF' > keyboards/keychron/v5/ansi/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            = {
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A }
            }
        };
        EOF
        
        # 4. 呼叫官方專案命令強制執行正式編譯
        qmk compile -kb keychron/v5/ansi -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        # 這次我們精準撈取正式編譯產出的單一完整二進位成品檔
        path: qmk_firmware/.build/*.bin
