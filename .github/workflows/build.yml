name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Ubuntu System Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr binutils-avr avr-libc gcc-arm-none-eabi libnewlib-arm-none-eabi git python3-pip

    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y -H ./qmk_firmware

    - name: Force Overwrite Pure VIA Project and Compile via Make
      run: |
        cd qmk_firmware
        
        # 1. 現場建立專案資料夾
        mkdir -p keyboards/fc980_ec/keymaps/default
        
        # 2. 現場寫入 C 語言版 rules.mk
        cat << 'EOF' > keyboards/fc980_ec/rules.mk
        MCU = STM32F401
        BOOTLOADER = stm32-dfu
        VIA_ENABLE = yes
        LTO_ENABLE = yes
        EOF
        
        # 3. 現場寫入 C 語言版 config.h
        cat << 'EOF' > keyboards/fc980_ec/config.h
        #pragma once
        #define MATRIX_ROWS 6
        #define MATRIX_COLS 16
        #define MATRIX_ROW_PINS { A0, A1, A2, A3, A4, A5 }
        #define MATRIX_COL_PINS { B0, B1, B2, B3, B4, B5, B6, B7, B8, B9, B10, B12, B13, B14, B15, A8 }
        #define DIODE_DIRECTION COL2ROW
        EOF
        
        # 4. 現場寫入相容的基礎頭文件
        echo '#include "fc980_ec.h"' > keyboards/fc980_ec/fc980_ec.c
        echo '#pragma once' > keyboards/fc980_ec/fc980_ec.h
        
        # 5. 現場寫入符合標準 QMK 陣列規範的 keymap.c 檔
        cat << 'EOF' > keyboards/fc980_ec/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            = {
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A }
            }
        };
        EOF
        
        # 6. 底層 Makefile 強制實體編譯
        make fc980_ec:default || true

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        # 【全域滴水不漏搜捕】追蹤整個 qmk_firmware 目錄下所有副檔名，不管它生在哪裡通通抓進壓縮包！
        path: |
          qmk_firmware/**/*.bin
          qmk_firmware/**/*.hex
          qmk_firmware/**/*.elf
