name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y -H ./qmk_firmware

    - name: Inject Configuration into Existing Project and Compile
      run: |
        cd qmk_firmware
        
        # 1. 徹底清理該官方官方專案原有的佈局與設定檔
        rm -rf keyboards/kovasap/seraph/keymaps/*
        mkdir -p keyboards/kovasap/seraph/keymaps/default
        
        # 2. 現場強行把這份官方專案的 info.json 覆蓋為我們的 STM32F401 6x16 盲測引腳規格書
        cat << 'EOF' > keyboards/kovasap/seraph/info.json
        {
          "keyboard_name": "FC980 EC VIA REMAKE",
          "url": "https://github.com",
          "maintainer": "qmk",
          "width": 16,
          "height": 6,
          "matrix_pins": {
            "cols": ["PIN_B0", "PIN_B1", "PIN_B2", "PIN_B3", "PIN_B4", "PIN_B5", "PIN_B6", "PIN_B7", "PIN_B8", "PIN_B9", "PIN_B10", "PIN_B12", "PIN_B13", "PIN_B14", "PIN_B15", "PIN_A8"],
            "rows": ["PIN_A0", "PIN_A1", "PIN_A2", "PIN_A3", "PIN_A4", "PIN_A5"]
          },
          "diode_direction": "COL2ROW",
          "processor": "STM32F401",
          "bootloader": "stm32-dfu",
          "features": {
            "via": true,
            "lto": true
          }
        }
        EOF
        
        # 3. 現場寫入符合標準 QMK 矩陣規範、填滿 96 顆按鍵的 keymap.c 檔
        cat << 'EOF' > keyboards/kovasap/seraph/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            = {
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A }
            }
        };
        EOF
        
        # 4. 呼叫官方絕對認得、100% 存在於資料庫中的合法型號名稱，執行編譯！
        qmk compile -kb kovasap/seraph -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        path: qmk_firmware/**/*.bin
