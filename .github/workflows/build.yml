name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        qmk setup -y

    - name: Modify Existing Project and Compile
      run: |
        # 1. 進入官方 QMK 原始碼目錄
        cd qmk_firmware
        
        # 2. 強行把官方現成的 acheron/shark 硬體設定書 (info.json) 覆蓋成我們的 STM32F401R8T6 6x16 盲測引腳
        cat << 'EOF' > keyboards/acheron/shark/info.json
        {
          "keyboard_name": "FC980 EC VIA REMAKE",
          "url": "",
          "maintainer": "qmk",
          "width": 16,
          "height": 6,
          "layouts": {
            "LAYOUT_all": {
              "layout": [
                {"matrix":, "x": 0, "y": 0}
              ]
            }
          },
          "matrix_pins": {
            "cols": ["GPIOB_0", "GPIOB_1", "GPIOB_2", "GPIOB_3", "GPIOB_4", "GPIOB_5", "GPIOB_6", "GPIOB_7", "GPIOB_8", "GPIOB_9", "GPIOB_10", "GPIOB_12", "GPIOB_13", "GPIOB_14", "GPIOB_15", "GPIOA_8"],
            "rows": ["GPIOA_0", "GPIOA_1", "GPIOA_2", "GPIOA_3", "GPIOA_4", "GPIOA_5"]
          },
          "diode_direction": "COL2ROW",
          "processor": "STM32F401",
          "bootloader": "stm32-dfu",
          "features": {
            "via": true,
            "lto": true
          }
        }
        EOF
        
        # 3. 強行覆蓋它的預設鍵位地圖 (keymap.c)
        cat << 'EOF' > keyboards/acheron/shark/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            [0] = LAYOUT_all(
                KC_A
            )
        };
        EOF
        
        # 4. 呼叫官方絕對認得的合法名稱，強制執行雲端編譯！
        qmk compile -kb acheron/shark -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        path: qmk_firmware/.build/*.bin
