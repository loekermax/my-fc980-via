name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        # 強制將 QMK 原始碼下載到當前工作目錄的 qmk_firmware 資料夾中
        qmk setup -y -H ./qmk_firmware

    - name: Modify Active Handwired Project and Compile
      run: |
        cd qmk_firmware
        
        # 1. 現場改寫官方必定存在的 stm32f401 測試模板 rules.mk (強制開啟 VIA 與 LTO)
        cat << 'EOF' > keyboards/handwired/onekey/stm32f401/rules.mk
        MCU = STM32F401
        BOOTLOADER = stm32-dfu
        VIA_ENABLE = yes
        LTO_ENABLE = yes
        EOF
        
        # 2. 現場改寫其 config.h (覆蓋為符合您 FC980-EC 的 6x16 盲測引腳)
        cat << 'EOF' > keyboards/handwired/onekey/stm32f401/config.h
        #pragma once
        #define MATRIX_ROWS 6
        #define MATRIX_COLS 16
        #define MATRIX_ROW_PINS { A0, A1, A2, A3, A4, A5 }
        #define MATRIX_COL_PINS { B0, B1, B2, B3, B4, B5, B6, B7, B8, B9, B10, B12, B13, B14, B15, A8 }
        #define DIODE_DIRECTION COL2ROW
        EOF
        
        # 3. 現場改寫其預設 keymap.c，塞滿對齊 6x16 的 96 顆標準基礎按鍵
        cat << 'EOF' > keyboards/handwired/onekey/stm32f401/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            = {
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A },
                { KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A }
            }
        };
        EOF
        
        # 4. 強制呼叫 Linux 底層的編譯指令進行暴力打包
        qmk compile -kb handwired/onekey/stm32f401 -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        path: qmk_firmware/.build/*.bin
