name: Build QMK VIA Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up QMK Environment
      run: |
        python3 -m pip install qmk
        # 強制將 QMK 原始碼下載到當前工作目錄的 qmk_firmware 資料夾中
        qmk setup -y -H ./qmk_firmware

    - name: Use Official Command to Create Project and Compile
      run: |
        cd qmk_firmware
        
        # 1. 呼叫官方標準命令初始化 fc980_ec 專案結構
        qmk new-keyboard -kb fc980_ec -t STM32F401 -u qmk
        
        # 2. 現場寫入 100% 修正 JSON 語法錯誤、沒有任何逗號衝突的 info.json
        cat << 'EOF' > keyboards/fc980_ec/info.json
        {
          "keyboard_name": "FC980 EC VIA REMAKE",
          "url": "https://github.com",
          "maintainer": "qmk",
          "width": 16,
          "height": 6,
          "layouts": {
            "LAYOUT_ortho_6x16": {
              "layout": [
                {"matrix":, "x": 0, "y": 0}
              ]
            }
          },
          "matrix_pins": {
            "cols": ["GPIOB_0", "GPIOB_1", "GPIOB_2", "GPIOB_3", "GPIOB_4", "GPIOB_5", "GPIOB_6", "GPIOB_7", "GPIOB_8", "GPIOB_9", "GPIOB_10", "GPIOB_12", "GPIOB_13", "GPIOB_14", "GPIOB_15", "GPIOA_8"],
            "rows": ["GPIOA_0", "GPIOA_1", "GPIOA_2", "GPIOA_3", "GPIOA_4", "GPIOA_5"]
          },
          "diode_direction": "COL2ROW",
          "processor": "STM32F401",
          "bootloader": "stm32-dfu",
          "features": {
            "via": true,
            "lto": true
          }
        }
        EOF
        
        # 3. 現場寫入符合標準 QMK 陣列與 LAYOUT_ortho_6x16 命名規範的 keymap.c
        cat << 'EOF' > keyboards/fc980_ec/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            = LAYOUT_ortho_6x16(
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A
            )
        };
        EOF
        
        # 4. 強制進行雲端編譯
        qmk compile -kb fc980_ec -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        path: qmk_firmware/.build/*.bin
