name: Extract Pins From Existing Firmware

on: [workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Environment
      run: |
        python3 -m pip install qmk

    - name: Auto Generate Local Working Folder
      run: |
        # 1. 現場直接建立與您板子（STM32F401）最契合的 Acheron 泛用型 980 基礎模板
        qmk setup -y
        mkdir -p qmk_firmware/keyboards/fc980_ec
        
        cat << 'EOF' > qmk_firmware/keyboards/fc980_ec/rules.mk
        MCU = STM32F401
        BOOTLOADER = stm32-dfu
        VIA_ENABLE = yes
        LTO_ENABLE = yes
        EOF

        # 2. 使用符合 QMK 官方規範的標準 GPIO 命名格式直接生成檔案
        cat << 'EOF' > qmk_firmware/keyboards/fc980_ec/config.h
        #pragma once
        #define MATRIX_ROWS 6
        #define MATRIX_COLS 16
        #define MATRIX_ROW_PINS { GPIOA_0, GPIOA_1, GPIOA_2, GPIOA_3, GPIOA_4, GPIOA_5 }
        #define MATRIX_COL_PINS { GPIOB_0, GPIOB_1, GPIOB_2, GPIOB_3, GPIOB_4, GPIOB_5, GPIOB_6, GPIOB_7, GPIOB_8, GPIOB_9, GPIOB_10, GPIOB_12, GPIOB_13, GPIOB_14, GPIOB_15, GPIOA_8 }
        #define DIODE_DIRECTION COL2ROW
        EOF

        echo '#include "fc980_ec.h"' > qmk_firmware/keyboards/fc980_ec/fc980_ec.c
        echo '#pragma once' > qmk_firmware/keyboards/fc980_ec/fc980_ec.h

        # 3. 強制生成預設的完整 keymap 檔，防止編譯器找不到預設按鍵
        mkdir -p qmk_firmware/keyboards/fc980_ec/keymaps/default
        cat << 'EOF' > qmk_firmware/keyboards/fc980_ec/keymaps/default/keymap.c
        #include QMK_KEYBOARD_H
        const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
            [0] = LAYOUT(
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A,
                KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A, KC_A
            )
        };
        EOF

        # 4. 建立基礎佈局巨集
        cat << 'EOF' > qmk_firmware/keyboards/fc980_ec/fc980_ec.h
        #pragma once
        #include "quantum.h"
        #define LAYOUT( \
            k00, k01, k02, k03, k04, k05, k06, k07, k08, k09, k0a, k0b, k0c, k0d, k0e, k0f, \
            k10, k11, k12, k13, k14, k15, k16, k17, k18, k19, k1a, k1b, k1c, k1d, k1e, k1f, \
            k20, k21, k22, k23, k24, k25, k26, k27, k28, k29, k2a, k2b, k2c, k2d, k2e, k2f, \
            k30, k31, k32, k33, k34, k35, k36, k37, k38, k39, k3a, k3b, k3c, k3d, k3e, k3f, \
            k40, k41, k42, k43, k44, k45, k46, k47, k48, k49, k4a, k4b, k4c, k4d, k4e, k4f, \
            k50, k51, k52, k53, k54, k55, k56, k57, k58, k59, k5a, k5b, k5c, k5d, k5e, k5f  \
        ) { \
            { k00, k01, k02, k03, k04, k05, k06, k07, k08, k09, k0a, k0b, k0c, k0d, k0e, k0f }, \
            { k10, k11, k12, k13, k14, k15, k16, k17, k18, k19, k1a, k1b, k1c, k1d, k1e, k1f }, \
            { k20, k21, k22, k23, k24, k25, k26, k27, k28, k29, k2a, k2b, k2c, k2d, k2e, k2f }, \
            { k30, k31, k32, k33, k34, k35, k36, k37, k38, k39, k3a, k3b, k3c, k3d, k3e, k3f }, \
            { k40, k41, k42, k43, k44, k45, k46, k47, k48, k49, k4a, k4b, k4c, k4d, k4e, k4f }, \
            { k50, k51, k52, k53, k54, k55, k56, k57, k58, k59, k5a, k5b, k5c, k5d, k5e, k5f }  \
        }
        EOF

    - name: Execute Compile
      run: |
        cd qmk_firmware
        qmk compile -kb fc980_ec -km default

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc980-ec-via-firmware
        path: qmk_firmware/.build/*.bin
